[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evidence-driven-dataset-intelligence"
version = "0.0.0"
description = "Evidence-driven, task-specific public dataset recommendation research system"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["sentence-transformers>=5.0,<6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.unittest]
start-directory = "tests"
